[project]
name = "student-placement-prediction-system"
version = "2.0.0"
description = "Student Placement Prediction System — SRM Institute of Science and Technology"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.0.0,<4.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "scipy>=1.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
